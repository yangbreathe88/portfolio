<meta property="og:description" content="이 화면이 켜지기까지, 그 모든 과정이 제 일입니다. VFX Producer 양수민">

<style>
/* ==========================================================
   TOKENS — theater dark / projector amber
   ========================================================== */
:root{
  --bg:#0A0807;
  --bg2:#120E0A;
  --amber:#E4A44A;
  --amber-hi:#F3C87E;
  --amber-lo:#7A5220;
  --ink:#EFE8DC;
  --mute:#9C9083;
  --faint:#584F44;
  --hair:rgba(239,232,220,.08);
  --serif:"Cormorant Garamond","Nanum Myeongjo",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",monospace;
  --ease:cubic-bezier(.19,.6,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.9;
  letter-spacing:-0.006em;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-lo);color:#fff}
img,video{display:block;max-width:100%}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--amber-hi)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.narrow{max-width:720px}

/* line unit — each phrase is its own breath */
.l{display:block}
@media(max-width:640px){ p .l{display:inline} p .l::after{content:" "} }

.kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.42em;
  text-transform:uppercase;color:var(--amber);
}
.credit{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--faint);
}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.on{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* ==========================================================
   MEDIA SLOTS — drop files in ./assets/, exact filename shown
   ========================================================== */
.slot{position:relative;background:var(--bg2);overflow:hidden}
.slot.r-scope{aspect-ratio:2.39/1}
.slot.r-wide{aspect-ratio:16/9}
.slot.r-tall{aspect-ratio:4/5}
.slot.r-poster{aspect-ratio:2/3}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot .ph{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;
  align-items:center;justify-content:center;text-align:center;padding:18px;
  border:1px dashed rgba(228,164,74,.25);
  background:radial-gradient(ellipse 70% 100% at 50% 115%,rgba(228,164,74,.06),transparent 60%),var(--bg2);
}
.slot .ph .fname{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--amber)}
.slot .ph .fdesc{font-size:12px;color:var(--faint);max-width:32ch;line-height:1.55}

.fill{
  font-family:var(--mono);color:var(--amber-hi);
  border-bottom:1px dashed rgba(228,164,74,.4);padding:0 2px;
}

/* ==========================================================
   HERO — expanding frame
   ========================================================== */
#hero{height:240vh}
.hero-stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-frame{
  position:relative;width:100vw;
  height:calc(100vw / 2.39);max-height:100vh;
  overflow:hidden;
  box-shadow:0 0 120px rgba(228,164,74,.07);
  will-change:height;
}
.hero-frame .slot,.hero-frame .slot .ph{position:absolute;inset:0}
.hero-veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,8,7,.1),transparent 35%,rgba(10,8,7,.6) 100%)}
.hero-copy{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:10vh;text-align:center;
  opacity:0;transition:opacity 1.6s var(--ease);
}
.hero-copy.lit{opacity:1}
.hero-copy h1{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(38px,6.2vw,76px);line-height:1.16;letter-spacing:.012em;
  text-shadow:0 2px 50px rgba(0,0,0,.9);
}
.hero-copy h1 .em{font-style:italic;color:var(--amber-hi)}
.hero-copy .sub{margin-top:20px;font-size:15px;color:var(--mute);letter-spacing:.03em;
  text-shadow:0 1px 24px rgba(0,0,0,.95)}
.hero-copy .credit{margin-top:34px}
.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.4em;color:var(--faint);
  opacity:0;transition:opacity 1.4s var(--ease)}
.scroll-hint.show{opacity:1;animation:hint 2.8s ease-in-out 1.4s infinite}
@keyframes hint{0%,100%{opacity:1}50%{opacity:.35}}
html.locked,html.locked body{overflow:hidden;height:100%}

/* ==========================================================
   CHAPTER TITLE CARDS — letterboxed interstitials
   ========================================================== */
.chapter{
  min-height:64vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:110px 28px;position:relative;
}
.chapter::before,.chapter::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:min(320px,50vw);height:1px;
  background:linear-gradient(90deg,transparent,rgba(228,164,74,.5),transparent);
}
.chapter::before{top:70px}
.chapter::after{bottom:70px}
.chapter .kicker{margin-bottom:30px}
.chapter h2{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(30px,4.6vw,54px);line-height:1.3;letter-spacing:.01em;
}
.chapter h2 .em{font-style:italic;color:var(--amber-hi)}
.chapter .ch-sub{margin-top:26px;color:var(--mute);font-size:15.5px;max-width:52ch;line-height:2}

/* ==========================================================
   PROLOGUE
   ========================================================== */
#prologue{padding:40px 0 170px}
#prologue .grid{display:grid;grid-template-columns:1fr .82fr;gap:80px;align-items:center}
#prologue p{color:var(--mute);font-size:16.5px}
#prologue p+p{margin-top:1.7em}
#prologue p b{color:var(--ink);font-weight:600}

/* ==========================================================
   CAREER
   ========================================================== */
#career{padding:20px 0 170px}
.t-list{border-top:1px solid var(--hair)}
.t-row{
  display:grid;grid-template-columns:170px 1fr;gap:48px;
  padding:44px 0;border-bottom:1px solid var(--hair);
}
.t-when{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--amber);padding-top:7px}
.t-role{font-size:20px;font-weight:650;letter-spacing:-.01em}
.t-org{font-size:13px;color:var(--faint);margin-top:5px;letter-spacing:.03em}
.t-desc{margin-top:16px;font-size:15px;color:var(--mute);max-width:58ch;line-height:1.95}
.t-tags{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.t-tags span{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--amber-hi);
  border:1px solid rgba(228,164,74,.22);padding:4px 11px;
}

/* ==========================================================
   CASES
   ========================================================== */
.case{padding:30px 0 170px}
.case-media-main{margin-bottom:70px}
.case-title-row{display:flex;align-items:baseline;gap:26px;margin-bottom:14px}
.case-no{font-family:var(--mono);font-size:11px;letter-spacing:.35em;color:var(--amber)}
.case h3{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(27px,3.6vw,42px);line-height:1.28;letter-spacing:.008em;
}
.case h3 .em{font-style:italic;color:var(--amber-hi)}
.case .role-line{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:56px}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.beat .b-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--amber);
  text-transform:uppercase;padding-bottom:14px;margin-bottom:18px;
  border-bottom:1px solid var(--hair);
}
.beat p{font-size:14.5px;color:var(--mute);line-height:2.05}
.beat p b{color:var(--ink);font-weight:600}
.case-subs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:60px}
.stat-row{display:flex;gap:64px;margin-top:64px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:44px;font-weight:500;color:var(--amber-hi);line-height:1}
.stat span{display:block;margin-top:10px;font-size:12px;color:var(--faint);letter-spacing:.05em}

/* pipeline */
.pipeline{margin-top:10px}
.pipe-track{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pipe-stage{
  background:transparent;border:1px solid var(--hair);
  padding:22px 10px 19px;text-align:center;cursor:pointer;
  transition:border-color .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease);
  color:var(--ink);font-family:var(--sans);
}
.pipe-stage .p-name{font-size:13.5px;font-weight:600}
.pipe-stage .p-en{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--faint);margin-top:6px;text-transform:uppercase}
.pipe-stage.lit{
  border-color:rgba(228,164,74,.55);
  background:linear-gradient(180deg,rgba(228,164,74,.12),rgba(228,164,74,.02));
  box-shadow:0 0 36px rgba(228,164,74,.14);
}
.pipe-stage.lit .p-name{color:var(--amber-hi)}
.pipe-note{
  margin-top:34px;min-height:86px;
  border-left:1px solid var(--amber);padding:4px 0 4px 26px;
  color:var(--mute);font-size:15px;line-height:2;
}
.pipe-note .pn-title{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
  color:var(--amber-hi);margin-bottom:8px;
}

/* ==========================================================
   TOOLS
   ========================================================== */
#tools{padding:30px 0 150px}
.tool-list{border-top:1px solid var(--hair)}
.tool-row{
  display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:center;
  padding:52px 0;border-bottom:1px solid var(--hair);
}
.tool-row h4{font-family:var(--mono);font-size:14px;letter-spacing:.22em;color:var(--amber-hi)}
.tool-row .t-what{margin-top:14px;font-size:15.5px;color:var(--mute);max-width:52ch;line-height:2}
.tool-row .t-impact{
  margin-top:20px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink);
}
.tool-row .t-impact::before{content:"— ";color:var(--amber)}
.tm-quote{
  padding:110px 28px 0;text-align:center;
  font-family:var(--serif);font-style:italic;
  font-size:clamp(21px,2.8vw,30px);line-height:1.7;color:var(--mute);
}
.tm-quote b{color:var(--amber-hi);font-weight:500}

/* ==========================================================
   FILMS
   ========================================================== */
#films{padding:30px 0 170px}
.film-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.film-card{position:relative;overflow:hidden;background:var(--bg2)}
.film-card .f-info{
  position:absolute;inset:auto 0 0 0;z-index:2;padding:60px 20px 20px;
  background:linear-gradient(180deg,transparent,rgba(7,5,4,.94) 66%);
}
.f-title{font-size:16.5px;font-weight:650}
.f-meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--amber);margin-top:6px;text-transform:uppercase}
.f-award{font-size:12.5px;color:var(--mute);margin-top:7px}
.film-card::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 80% 60% at 50% 100%,rgba(228,164,74,.16),transparent 60%);
  transition:opacity .7s var(--ease);
}
.film-card:hover::after{opacity:1}
.comm{margin-top:96px}
.comm .c-head{font-family:var(--mono);font-size:10px;letter-spacing:.34em;color:var(--faint);text-transform:uppercase;margin-bottom:22px}
.c-row{
  display:grid;grid-template-columns:1fr auto 90px;gap:28px;align-items:baseline;
  padding:17px 0;border-top:1px solid var(--hair);font-size:15px;
}
.c-row:last-child{border-bottom:1px solid var(--hair)}
.c-client{font-weight:600}
.c-role{color:var(--mute);font-size:13px}
.c-year{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right}
.x-row{
  padding:15px 0;border-top:1px solid var(--hair);
  font-size:14.5px;color:var(--mute);
}
.x-row:last-child{border-bottom:1px solid var(--hair)}

/* ==========================================================
   EPILOGUE
   ========================================================== */
#epilogue{
  padding:190px 0 140px;text-align:center;
  background:radial-gradient(ellipse 80% 65% at 50% 105%,rgba(228,164,74,.09),transparent 62%);
}
#epilogue h2{
  font-family:var(--serif);font-weight:500;
  font-size:clamp(28px,4.2vw,50px);line-height:1.34;
}
#epilogue h2 .em{font-style:italic;color:var(--amber-hi)}
#epilogue .ep-sub{margin:30px auto 60px;color:var(--mute);font-size:15.5px;max-width:50ch;line-height:2}
.cta{
  display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.22em;
  color:var(--amber-hi);border:1px solid rgba(228,164,74,.45);padding:16px 40px;
  transition:background .4s var(--ease),box-shadow .4s var(--ease);
}
.cta:hover{background:rgba(228,164,74,.08);box-shadow:0 0 44px rgba(228,164,74,.16)}
footer{padding:60px 0 50px;text-align:center}

/* ==========================================================
   RESPONSIVE / MOTION
   ========================================================== */
@media(max-width:900px){
  #hero{height:auto}
  .hero-stage{position:relative;height:100svh}
  .hero-frame{height:100svh;max-height:100svh}
  #prologue .grid{grid-template-columns:1fr;gap:52px}
  .t-row{grid-template-columns:1fr;gap:10px;padding:36px 0}
  .beats{grid-template-columns:1fr;gap:38px}
  .case-subs{grid-template-columns:1fr}
  .tool-row{grid-template-columns:1fr;gap:26px}
  .film-grid{grid-template-columns:1fr 1fr}
  .pipe-track{grid-template-columns:repeat(3,1fr)}
  .stat-row{gap:44px}
}
@media(max-width:520px){
  .film-grid{grid-template-columns:1fr}
  .pipe-track{grid-template-columns:repeat(2,1fr)}
  .chapter{min-height:52vh}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rv{opacity:1;transform:none;transition:none}
  .scroll-hint{animation:none}
  #hero{height:auto}
  .hero-stage{position:relative}
  .hero-frame{height:100svh;max-height:100svh}
}
</style>
</head>

/* ============================================================
   RENDERER — turns SITE data into DOM.
   lines(arr) joins line arrays with breath-preserving spans.
   ============================================================ */
function lines(arr){ return arr.map(l => "<span class='l'>" + l + "</span>").join(""); }
function slot(m){
  var ratio = m.ratio ? " " + m.ratio : "";
  var poster = m.poster ? " data-poster='" + m.poster + "'" : "";
  var once = m.once ? " data-once='1'" : "";
  var delay = m.delay ? " data-delay='" + m.delay + "'" : "";
  var kind = m.file.match(/\.(jpg|jpeg|png|webp|avif)$/i) ? "img" : "video";
  return "<div class='slot" + ratio + "' data-kind='" + kind + "' data-file='" + m.file + "'" + poster + once + delay +
         " data-desc=\"" + (m.desc || "") + "\"></div>";
}
function chapter(c){
  return "<section class='chapter'>" +
    "<p class='kicker rv'>" + c.kicker + "</p>" +
    "<h2 class='rv d1'>" + lines(c.title) + "</h2>" +
    "<p class='ch-sub rv d2'>" + lines(c.sub) + "</p>" +
  "</section>";
}

    "<div class='hero-frame' id='heroFrame'>" + slot(SITE.hero.media) +

      "<h1 class='rv'>" + SITE.hero.title.map(t => "<span class='l'>" + t.join("") + "</span>").join("") + "</h1>" +

/* ============================================================
   MEDIA SLOT LOADER — missing file shows filename placeholder
   ============================================================ */
(function initSlots(){
  document.querySelectorAll(".slot[data-file]").forEach(function(el){
    var kind = el.getAttribute("data-kind");
    var file = el.getAttribute("data-file");
    var desc = el.getAttribute("data-desc") || "";
    function ph(name){
      el.innerHTML = "<div class='ph'>" +
        "<div class='fname'>" + name + "</div>" +
        (desc ? "<div class='fdesc'>" + desc + "</div>" : "") +
      "</div>";
    }
    if(kind === "img"){
      var img = new Image();
      img.alt = desc;
      img.onload = function(){ el.appendChild(img); };
      img.onerror = function(){ ph(file); };
      img.src = file;
    }else{
      var v = document.createElement("video");
      var delay = parseInt(el.getAttribute("data-delay") || "0", 10);
      v.muted = true; v.setAttribute("muted","");
      if(!delay){ v.autoplay = true; v.setAttribute("autoplay",""); }
      v.loop = !el.getAttribute("data-once");
      v.playsInline = true; v.setAttribute("playsinline","");
      v.preload = el.getAttribute("data-once") ? "auto" : "metadata";
      var poster = el.getAttribute("data-poster");
      if(poster){ v.poster = poster; }
      var s1 = document.createElement("source"); s1.src = file + ".webm"; s1.type = "video/webm";
      var s2 = document.createElement("source"); s2.src = file + ".mp4";  s2.type = "video/mp4";
      var fails = 0;
      function fail(){ fails++; if(fails >= 2){ ph(file + ".mp4"); } }
      s1.onerror = fail; s2.onerror = fail;
      v.appendChild(s1); v.appendChild(s2);
      el.appendChild(v);
      var armed = delay === 0;
      function tryPlay(){
        if(!armed) return;
        var p = v.play();
        if(p && p.catch){ p.catch(function(){}); }
      }
      v.addEventListener("loadeddata", tryPlay);
      if(delay){
        setTimeout(function(){ armed = true; tryPlay(); }, delay);
      } else {
        tryPlay();
      }
      /* autoplay-policy fallback: start on first user interaction */
      ["pointerdown","touchstart","keydown","scroll"].forEach(function(ev){
        addEventListener(ev, function(){
          if(armed && v.paused && !v.ended){ tryPlay(); }
        }, {once:true, passive:true});
      });
    }
  });
})();

/* ============================================================
   REVEAL
   ============================================================ */
(function(){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); } });
  }, {threshold:.12});
  document.querySelectorAll(".rv").forEach(function(el){ io.observe(el); });
})();

/* ============================================================
   HERO LETTERBOX REVEAL (ScreenX homage)
   full-bleed video letterboxed at 2.39:1; scrolling opens the
   black bars until the frame fills the viewport.
   ============================================================ */
(function(){
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var narrow = matchMedia("(max-width: 900px)").matches;
  if(reduced || narrow) return;
  var hero = document.getElementById("hero");
  var frame = document.getElementById("heroFrame");
  var ticking = false;
  function update(){
    ticking = false;
    var total = hero.offsetHeight - innerHeight;
    var p = Math.min(1, Math.max(0, -hero.getBoundingClientRect().top / total));
    var e = 1 - Math.pow(1 - p, 3);
    var h0 = Math.min(innerWidth / 2.39, innerHeight);
    frame.style.height = (h0 + (innerHeight - h0) * e) + "px";
  }
  addEventListener("scroll", function(){
    if(!ticking){ ticking = true; requestAnimationFrame(update); }
  }, {passive:true});
  addEventListener("resize", update);
  update();
})();

/* ============================================================
   HERO INTRO SEQUENCE — scroll is locked until the light-up
   video ends and the title appears; then scroll unlocks and
   the SCROLL hint fades in.
   Fallbacks: reduced motion, missing video, or 9s safety timer.
   ============================================================ */
(function(){
  var copy = document.querySelector(".hero-copy");
  var slotEl = document.querySelector("#heroFrame .slot");
  var hint = document.querySelector(".scroll-hint");
  if(!copy) return;
  var done = false;
  function reveal(){
    if(done) return; done = true;
    copy.classList.add("lit");
    document.documentElement.classList.remove("locked");
    if(hint){ setTimeout(function(){ hint.classList.add("show"); }, 900); }
  }
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ reveal(); return; }
  var v = slotEl ? slotEl.querySelector("video") : null;
  if(!v){ reveal(); return; }
  /* lock the page for the intro */
  if("scrollRestoration" in history){ history.scrollRestoration = "manual"; }
  scrollTo(0, 0);
  document.documentElement.classList.add("locked");
  v.addEventListener("ended", reveal);
  /* placeholder replaced the video (file missing) -> show copy */
  setTimeout(function(){ if(!slotEl.contains(v)) reveal(); }, 1600);
  /* safety net */
  setTimeout(reveal, 9000);
})();

/* ============================================================
   PIPELINE LIGHT
   ============================================================ */
(function(){
  var stages = document.querySelectorAll(".pipe-stage");
  var note = document.getElementById("pipeNote");
  if(!note) return;
  function light(s){
    stages.forEach(function(x){ x.classList.remove("lit"); });
    s.classList.add("lit");
    note.innerHTML = "<span class='pn-title'>" + s.getAttribute("data-note-title") + "</span>" +
                     s.getAttribute("data-note");
  }
  stages.forEach(function(s){
    ["mouseenter","click","focus"].forEach(function(ev){
      s.addEventListener(ev, function(){ light(s); });
    });
  });
})();
</script>
