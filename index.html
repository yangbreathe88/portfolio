<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>양수민 — Producer Beyond the Frame</title>
<meta name="description" content="이 화면이 켜지기까지, 그 모든 과정이 제 일입니다. VFX Producer 양수민">
<meta property="og:title" content="양수민 — Producer Beyond the Frame">
<meta property="og:description" content="이 화면이 켜지기까지, 그 모든 과정이 제 일입니다. VFX Producer 양수민">
<meta property="og:image" content="assets/hero_poster.jpg">
<meta property="og:type" content="website">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================
   TOKENS — theater dark / projector amber
   ========================================================== */
:root{
  --bg:#0A0807;
  --bg2:#120E0A;
  --amber:#E4A44A;
  --amber-hi:#F3C87E;
  --amber-lo:#7A5220;
  --ink:#EFE8DC;
  --mute:#AA9E8F;
  --faint:#7A6F5F;
  --hair:rgba(239,232,220,.08);
  --serif:"Noto Serif KR","Nanum Myeongjo",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",monospace;
  --ease:cubic-bezier(.19,.6,.22,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16.5px;line-height:1.9;
  letter-spacing:-0.006em;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--amber-lo);color:#fff}
img,video{display:block;max-width:100%}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--amber-hi)}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.wrap{max-width:1040px;margin:0 auto;padding:0 28px}
.narrow{max-width:720px}

/* line unit — each phrase is its own breath */
.l{display:block}
@media(max-width:640px){ p .l{display:inline} p .l::after{content:" "} }
/* flow mode: line arrays merge into one flowing paragraph */
.flow{text-align:left;word-break:keep-all;overflow-wrap:break-word}
.flow .l{display:inline}
.flow .l::after{content:" "}

.kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.42em;
  text-transform:uppercase;color:var(--amber);
}
.credit{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--faint);
}

/* reveal */
.rv{opacity:0;transform:translateY(30px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.on{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* ==========================================================
   MEDIA SLOTS — drop files in ./assets/, exact filename shown
   ========================================================== */
.slot{position:relative;background:var(--bg2);overflow:hidden}
.slot.r-scope{aspect-ratio:2.39/1}
.slot.r-wide{aspect-ratio:16/9}
.slot.r-tall{aspect-ratio:4/5}
.slot.r-poster{aspect-ratio:2/3}
.slot img,.slot video{width:100%;height:100%;object-fit:cover}
.slot iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.slot.fit-contain{background:#000}
.slot.fit-contain img,.slot.fit-contain video{object-fit:contain}
.slot .ph{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:9px;
  align-items:center;justify-content:center;text-align:center;padding:18px;
  border:1px dashed rgba(228,164,74,.25);
  background:radial-gradient(ellipse 70% 100% at 50% 115%,rgba(228,164,74,.06),transparent 60%),var(--bg2);
}
.slot .ph .fname{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;color:var(--amber)}
.slot .ph .fdesc{font-size:12px;color:var(--faint);max-width:32ch;line-height:1.55}

.fill{
  font-family:var(--mono);color:var(--amber-hi);
  border-bottom:1px dashed rgba(228,164,74,.4);padding:0 2px;
}

/* ==========================================================
   HERO — expanding frame
   ========================================================== */
#hero{height:240vh}
.hero-stage{position:sticky;top:0;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-frame{
  position:relative;width:100vw;
  height:calc(100vw / 2.39);max-height:100vh;
  overflow:hidden;
  box-shadow:0 0 120px rgba(228,164,74,.07);
  will-change:height;
}
.hero-frame .slot,.hero-frame .slot .ph{position:absolute;inset:0}
.hero-veil{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,8,7,.1),transparent 35%,rgba(10,8,7,.6) 100%)}
.hero-copy{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding-bottom:10vh;text-align:center;
  opacity:0;transition:opacity 1.6s var(--ease);
}
.hero-copy.lit{opacity:1}
.hero-copy h1{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(24px,4vw,36px);line-height:1.5;letter-spacing:-.015em;word-break:keep-all;
  text-shadow:0 2px 50px rgba(0,0,0,.9),0 0 34px rgba(228,164,74,.16);
}
.hero-copy h1 .em{font-style:normal;font-weight:600;color:var(--amber-hi);text-shadow:0 0 26px rgba(228,164,74,.5)}
.hero-copy .sub{margin-top:20px;font-size:15px;color:var(--mute);letter-spacing:.03em;
  text-shadow:0 1px 24px rgba(0,0,0,.95)}
.hero-copy .credit{margin-top:34px}
.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.4em;color:var(--faint);
  opacity:0;transition:opacity 1.4s var(--ease)}
.scroll-hint.show{opacity:1;animation:hint 2.8s ease-in-out 1.4s infinite}
@keyframes hint{0%,100%{opacity:1}50%{opacity:.35}}
html.locked,html.locked body{overflow:hidden;height:100%}
html{scroll-behavior:smooth}

/* ==========================================================
   CHAPTER NAV — fades in when the intro releases the scroll
   ========================================================== */
#siteNav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  display:flex;justify-content:center;flex-wrap:wrap;gap:4px 28px;
  padding:20px 16px 26px;
  background:linear-gradient(180deg,rgba(10,8,7,.88) 0%,rgba(10,8,7,.5) 60%,transparent 100%);
  opacity:0;transform:translateY(-10px);pointer-events:none;
  transition:opacity 1.1s var(--ease),transform 1.1s var(--ease);
}
#siteNav.show{opacity:1;transform:none;pointer-events:auto}
#siteNav a{
  font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;text-decoration:none;
  color:var(--faint);transition:color .3s var(--ease),text-shadow .3s var(--ease);
}
#siteNav a:hover{color:var(--amber-hi);text-shadow:0 0 14px rgba(228,164,74,.5)}
@media(max-width:640px){
  #siteNav{gap:4px 16px;padding:14px 10px 20px}
  #siteNav a{font-size:9px;letter-spacing:.16em}
}

/* ==========================================================
   CHAPTER TITLE CARDS — full-screen pinned interstitials
   the title fills the viewport and holds while you scroll,
   then releases into the chapter content (reading tempo).
   ========================================================== */
.chapter{height:190vh;position:relative}
.ch-stage{
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:0 28px;overflow:hidden;
}
.ch-stage::before,.ch-stage::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:min(320px,50vw);height:1px;
  background:linear-gradient(90deg,transparent,rgba(228,164,74,.5),transparent);
}
.ch-stage::before{top:70px}
.ch-stage::after{bottom:70px}
.ch-inner{will-change:opacity,transform}
.chapter .kicker{margin-bottom:30px}
.chapter h2{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(24px,4.6vw,54px);line-height:1.42;letter-spacing:-.015em;word-break:keep-all;
  text-shadow:0 0 38px rgba(239,232,220,.12);
}
.chapter h2 .em{font-style:normal;font-weight:600;color:var(--amber-hi);text-shadow:0 0 24px rgba(228,164,74,.45)}
.chapter .ch-sub{margin:26px auto 0;color:var(--mute);font-size:15.5px;max-width:52ch;line-height:2}
.chapter.accent .ch-stage{
  background:radial-gradient(ellipse 70% 55% at 50% 50%,rgba(228,164,74,.10),transparent 68%);
}
.chapter.accent h2{font-size:clamp(28px,5.8vw,66px);letter-spacing:-.02em}
.chapter.accent .ch-stage::before,.chapter.accent .ch-stage::after{
  width:min(460px,64vw);
  background:linear-gradient(90deg,transparent,rgba(228,164,74,.75),transparent);
}
.case-hold{height:150vh}
.case-hold .kicker{font-size:13px;letter-spacing:.34em}
.case-hold .kicker .l{margin-top:10px}
.case-hold .kicker .l:first-child{margin-top:0}
.case-hold h2{font-size:clamp(30px,5.6vw,66px)}
.case-hold .ch-sub{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);
  max-width:none;text-align:center;
}
.case-hold .ch-sub .l{margin-top:8px}
.case-hold .ch-sub .l:first-child{margin-top:0}

/* ==========================================================
   PROLOGUE
   ========================================================== */
#prologue{padding:40px 0 65px}
#prologue .grid{display:grid;grid-template-columns:1fr .82fr;gap:80px;align-items:center}
#prologue p{color:var(--mute);font-size:16.5px}
#prologue p+p{margin-top:1.7em}
#prologue p b{color:var(--ink);font-weight:600}

/* ==========================================================
   CAREER
   ========================================================== */
#career{padding:20px 0 170px}
.t-list{position:relative}
.t-list::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;
  background:linear-gradient(180deg,rgba(228,164,74,.55),rgba(228,164,74,.06));
}
.t-row{
  position:relative;
  display:grid;grid-template-columns:150px 1fr 120px;gap:44px;
  padding:44px 0 44px 40px;border-bottom:1px solid var(--hair);
}
.t-row::before{
  content:"";position:absolute;left:-4px;top:54px;
  width:9px;height:9px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 14px rgba(228,164,74,.7);
}
.t-when{font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--amber);padding-top:7px}
.t-role{font-size:20px;font-weight:650;letter-spacing:-.01em}
.t-org{font-size:16px;color:var(--ink);font-weight:600;margin-top:7px;letter-spacing:.02em}
.t-desc{margin-top:16px;font-size:15px;color:var(--mute);max-width:58ch;line-height:1.95}
.t-projects{margin-top:18px}
.t-prj{
  position:relative;padding-left:14px;
  font-size:12px;color:var(--faint);line-height:2.05;letter-spacing:.01em;
}
.t-prj::before{content:"\00B7";position:absolute;left:2px;color:var(--amber)}
.t-logo{width:120px;height:48px;background:transparent;justify-self:end;align-self:start;margin-top:6px}
.t-logo img{object-fit:contain !important;opacity:.85;filter:grayscale(1) brightness(1.6)}
.t-logo .ph{border-color:rgba(228,164,74,.18)}
.t-logo .ph .fname{font-size:8.5px;letter-spacing:0}
.t-logo .ph .fdesc{display:none}
.t-tags{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.t-tags span{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--amber-hi);
  border:1px solid rgba(228,164,74,.22);padding:4px 11px;
}

/* ==========================================================
   CASES
   ========================================================== */
.case{padding:30px 0 170px}
.case-media-main{margin-bottom:70px}
.case-title-row{display:flex;align-items:baseline;gap:26px;margin-bottom:14px}
.case-no{font-family:var(--mono);font-size:11px;letter-spacing:.35em;color:var(--amber)}
.case h3{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(27px,3.6vw,42px);line-height:1.28;letter-spacing:.008em;
}
.case h3 .em{font-style:normal;font-weight:600;color:var(--amber-hi);text-shadow:0 0 24px rgba(228,164,74,.45)}
.case .role-line{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--faint);margin-bottom:56px}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.beat .b-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--amber);
  text-transform:uppercase;padding-bottom:14px;margin-bottom:18px;
  border-bottom:1px solid var(--hair);
}
.beat p{font-size:14.5px;color:var(--mute);line-height:2.05}
.beat p b{color:var(--ink);font-weight:600}
.case-subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:60px}
.also{margin-top:96px;padding-top:64px;border-top:1px solid var(--hair)}
.also-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--amber);
  text-transform:uppercase;margin-bottom:18px;
}
.also-title{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(21px,2.8vw,32px);line-height:1.35;margin-bottom:20px;
}
.also-lines{font-size:15px;color:var(--mute);max-width:none;line-height:2.1}
.also-lines b{color:var(--ink);font-weight:600}
.also .case-subs{margin-top:40px}

/* ==========================================================
   WORKS CAROUSEL — arrow-navigated slides, responsive
   3-up desktop / 2-up tablet / 1-up mobile
   ========================================================== */
.works{margin-top:96px;padding-top:64px;border-top:1px solid var(--hair)}
.works .also-label{margin-bottom:26px}
.works-body{position:relative}
.works-edge{
  position:absolute;top:0;bottom:0;width:70px;z-index:4;
  display:flex;align-items:center;justify-content:center;
  border:0;cursor:pointer;padding:0;
  color:rgba(255,255,255,.85);font-size:34px;font-family:var(--sans);line-height:1;
  transition:opacity .3s var(--ease);opacity:.8;
}
.works-edge:hover{opacity:1}
.works-edge.prev{left:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.works-edge.next{right:0;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent)}
@media(max-width:640px){ .works-edge{width:48px;font-size:28px} }
.works-track{
  display:flex;gap:16px;
  overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;
  scrollbar-width:none;-ms-overflow-style:none;
}
.works-track::-webkit-scrollbar{display:none}
.work-card{
  flex:0 0 calc((100% - 32px)/3);
  scroll-snap-align:start;
}
.work-card .slot{margin-bottom:14px}
.drive-card{border:0;padding:0;cursor:pointer;width:100%;display:block}
.drive-card img{width:100%;height:100%;object-fit:cover;display:block}
.play-badge{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:54px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,8,7,.78);color:#fff;font-size:15px;
  border:1px solid rgba(228,164,74,.4);
  transition:background .3s var(--ease);pointer-events:none;
}
.drive-card:hover .play-badge{background:rgba(228,164,74,.85);color:#0A0807}
.w-title{font-size:15.5px;font-weight:650}
.w-role{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--amber);margin-top:5px;text-transform:uppercase}
.w-note{font-size:13px;color:var(--mute);margin-top:7px;line-height:1.8}
@media(max-width:1100px){ .work-card{flex-basis:calc((100% - 16px)/2)} }
@media(max-width:640px){ .work-card{flex-basis:100%} }
.also-main{margin:36px 0 28px}

/* ==========================================================
   NDA CARD — a project that cannot be shown, shown well
   ========================================================== */
.nda-card{
  position:relative;margin-bottom:70px;
  padding:clamp(56px,9vw,110px) 28px;
  text-align:center;
  border:1px solid rgba(228,164,74,.22);
  background:
    radial-gradient(ellipse 60% 80% at 50% 110%, rgba(228,164,74,.08), transparent 60%),
    #0D0A08;
  overflow:hidden;
}
.nda-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg, transparent 0 22px, rgba(228,164,74,.025) 22px 23px);
}
.nda-kicker{
  font-family:var(--mono);font-size:10px;letter-spacing:.38em;
  color:var(--faint);text-transform:uppercase;margin-bottom:22px;
}
.nda-title{
  font-family:var(--mono);font-size:clamp(17px,2.6vw,26px);
  letter-spacing:.3em;color:var(--amber-hi);
  text-shadow:0 0 30px rgba(228,164,74,.4);
  margin-bottom:26px;
}
.nda-lines{font-size:14px;color:var(--mute);line-height:2.05}
.nda-tag{
  display:inline-block;margin-top:30px;
  font-family:var(--mono);font-size:10px;letter-spacing:.26em;
  color:var(--amber);border:1px solid rgba(228,164,74,.4);
  padding:8px 18px;
}

/* ==========================================================
   CASE GALLERY — horizontal drag/swipe strip, snap scrolling.
   Drop photos as <prefix>1.jpg, 2, 3 ... auto-detected.
   ========================================================== */
.gallery-note{
  margin:84px 0 6px;
  font-size:15px;color:var(--mute);line-height:2.05;
}
/* auto-advancing slider: image holds, slides right, white dot nav */
.case-gallery{position:relative;margin-top:60px;overflow:hidden}
.cg-track{display:flex;transition:transform .85s var(--ease)}
.cg-frame{flex:0 0 100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg2)}
.cg-frame img,.cg-frame video{width:100%;height:100%;object-fit:cover}
.cg-ph{
  flex:0 0 100%;aspect-ratio:16/9;
  display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;
  border:1px dashed rgba(228,164,74,.25);text-align:center;padding:16px;
}
.cg-ph .fname{font-family:var(--mono);font-size:11.5px;color:var(--amber)}
.cg-ph .fdesc{font-size:12px;color:var(--faint)}
.cg-dots{
  position:absolute;left:0;right:0;bottom:16px;z-index:3;
  display:flex;gap:9px;justify-content:center;
}
.cg-dot{
  width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:rgba(255,255,255,.35);
  transition:background .4s var(--ease),transform .4s var(--ease);
}
.cg-dot:hover{background:rgba(255,255,255,.6)}
.cg-dot.on{background:#fff;transform:scale(1.25)}
.cg-edge{
  position:absolute;top:0;bottom:0;width:64px;z-index:4;
  display:flex;align-items:center;justify-content:center;
  border:0;cursor:pointer;padding:0;
  color:rgba(255,255,255,.85);font-size:32px;font-family:var(--sans);line-height:1;
  opacity:.75;transition:opacity .3s var(--ease);
}
.cg-edge:hover{opacity:1}
.cg-edge.prev{left:0;background:linear-gradient(90deg,rgba(0,0,0,.4),transparent)}
.cg-edge.next{right:0;background:linear-gradient(270deg,rgba(0,0,0,.4),transparent)}
@media(max-width:640px){ .cg-edge{width:44px;font-size:26px} }
.stat-row{display:flex;gap:64px;margin-top:64px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:44px;font-weight:600;color:var(--amber-hi);line-height:1}
.stat span{display:block;margin-top:10px;font-size:12px;color:var(--faint);letter-spacing:.05em}

/* pipeline */
.pipeline{margin-top:10px}
.pipe-track{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.pipe-stage{
  flex:1 1 150px;min-width:132px;
  background:transparent;border:1px solid var(--hair);
  padding:22px 10px 19px;text-align:center;cursor:pointer;
  transition:border-color .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease);
  color:var(--ink);font-family:var(--sans);
}
.pipe-stage .p-name{font-size:13.5px;font-weight:600}
.pipe-stage .p-en{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--faint);margin-top:6px;text-transform:uppercase}
.pipe-stage.lit{
  border-color:rgba(228,164,74,.55);
  background:linear-gradient(180deg,rgba(228,164,74,.12),rgba(228,164,74,.02));
  box-shadow:0 0 36px rgba(228,164,74,.14);
}
.pipe-stage.lit .p-name{color:var(--amber-hi)}
.pipe-note{
  margin-top:34px;min-height:86px;
  border-left:1px solid var(--amber);padding:4px 0 4px 26px;
  color:var(--mute);font-size:15px;line-height:2;
}
.pipe-note .pn-title{
  display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;
  color:var(--amber-hi);margin-bottom:8px;
}

/* ==========================================================
   TOOLS
   ========================================================== */

.tool-list{border-top:1px solid var(--hair)}
.tool-row{
  display:grid;grid-template-columns:1fr 520px;gap:56px;align-items:center;
  padding:52px 0;border-bottom:1px solid var(--hair);

.tool-row .slot{cursor:zoom-in}

.tool-row .t-what{margin-top:14px;font-size:15.5px;color:var(--mute);max-width:52ch;line-height:2}
.tool-row .t-impact{
  margin-top:20px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--ink);
}
.tool-row .t-impact::before{content:"— ";color:var(--amber)}

  padding:110px 28px 0;text-align:center;
  font-family:var(--serif);font-style:normal;
  font-size:clamp(21px,2.8vw,30px);line-height:1.7;color:var(--mute);
}
.tm-quote b{color:var(--amber-hi);font-weight:600;text-shadow:0 0 20px rgba(228,164,74,.4)}

/* ==========================================================

   left to right like film through a projector.
   Drop photos as assets/roll_01.jpg, roll_02.jpg ... (max 24)
   ========================================================== */
.film-roll{
  position:relative;overflow:hidden;
  background:#060504;
  padding:26px 0;
  margin-bottom:120px;
  border-top:1px solid rgba(228,164,74,.12);
  border-bottom:1px solid rgba(228,164,74,.12);
}
.film-roll::before,.film-roll::after{
  content:"";position:absolute;left:0;right:0;height:10px;z-index:2;
  background-image:radial-gradient(circle at center,rgba(228,164,74,.4) 2.2px,transparent 3.2px);
  background-size:22px 10px;background-repeat:repeat-x;
}
.film-roll::before{top:8px}
.film-roll::after{bottom:8px}
.roll-track{
  display:flex;gap:10px;width:max-content;
  animation:rollflow 60s linear infinite;
}
.film-roll:hover .roll-track{animation-play-state:paused}
@keyframes rollflow{from{transform:translateX(-50%)}to{transform:translateX(0)}}
.roll-frame{
  height:172px;flex:0 0 auto;overflow:hidden;
  background:var(--bg2);
}
.roll-frame img{height:100%;width:auto;display:block}
.roll-ph{
  height:172px;width:260px;flex:0 0 auto;
  display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
  border:1px dashed rgba(228,164,74,.25);text-align:center;padding:12px;
}
.roll-ph .fname{font-family:var(--mono);font-size:11px;color:var(--amber)}
.roll-ph .fdesc{font-size:11px;color:var(--faint)}
@media(max-width:640px){
  .roll-frame,.roll-ph{height:120px}
  .film-roll{padding:20px 0;margin-bottom:80px}
}
@media(prefers-reduced-motion:reduce){
  .roll-track{animation:none}
  .film-roll{overflow-x:auto}
}

.manifesto{padding:40px 0 150px;text-align:center}
.manifesto .mf{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(16px,2.1vw,24px);line-height:1.95;
  letter-spacing:-.01em;word-break:keep-all;color:var(--ink);
  text-shadow:0 0 34px rgba(239,232,220,.1);

.manifesto .mf .em{color:var(--amber-hi);text-shadow:0 0 24px rgba(228,164,74,.45)}

.dw-label{
  text-align:center;margin-bottom:56px;
  font-family:var(--mono);font-size:11px;letter-spacing:.34em;
  color:var(--amber);text-transform:uppercase;

   ========================================================== */

  position:fixed;inset:0;z-index:100;

  background:rgba(5,4,3,.92);padding:4vh 4vw;cursor:zoom-out;
}
#lightbox.open{display:flex}
#lightbox .lb-content{max-width:92vw;max-height:92vh;display:flex}

  max-width:92vw;max-height:88vh;width:auto;height:auto;
  box-shadow:0 0 90px rgba(0,0,0,.8);
}
#lightbox iframe{
  width:min(1200px,92vw);aspect-ratio:16/9;border:0;
  box-shadow:0 0 90px rgba(0,0,0,.8);background:#000;
}
.lb-hint{
  position:fixed;top:20px;right:26px;
  font-family:var(--mono);font-size:10px;letter-spacing:.24em;
  color:var(--faint);
}

   ========================================================== */

  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;

.c-year{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right}

.x-row:last-child{border-bottom:1px solid var(--hair)}

/* ============================================================
   RENDERER — turns SITE data into DOM.
   lines(arr) joins line arrays with breath-preserving spans.
   ============================================================ */
function driveId(v){
  var d = String(v).match(/drive\.google\.com\/file\/d\/([^\/?]+)/);
  return d ? d[1] : null;
}
function embedSrc(v){
  /* accepts: raw youtube id, youtu.be / youtube.com URLs, Google Drive share URLs */
  v = String(v).trim();
  var d = v.match(/drive\.google\.com\/file\/d\/([^\/?]+)/);
  if(d){ return "https://drive.google.com/file/d/" + d[1] + "/preview"; }
  var y = v.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
  var id = y ? y[1] : v;
  return "https://www.youtube-nocookie.com/embed/" + id + "?rel=0";
}
function esc(t){
  /* keep real markup (<b> <span> <em> <i> <br>) working; show any other <...> as literal text */
  return String(t).replace(/<(?!\/?(?:b|span|em|i|br)[\s>\/])/gi, "&lt;");
}
function lines(arr){ return arr.map(l => "<span class='l'>" + esc(l) + "</span>").join(""); }
function slot(m){
  var ratio = (m.ratio ? " " + m.ratio : "") + (m.fit === "contain" ? " fit-contain" : "");
  if(m.youtube){
    return "<div class='slot" + ratio + "'>" +
      "<iframe src='" + embedSrc(m.youtube) + "' " +
      "title='video' loading='lazy' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' " +
      "allowfullscreen></iframe></div>";
  }
  var poster = m.poster ? " data-poster='" + m.poster + "'" : "";
  var once = m.once ? " data-once='1'" : "";
  var delay = m.delay ? " data-delay='" + m.delay + "'" : "";
  var kind = m.file.match(/\.(jpg|jpeg|png|gif|webp|avif)$/i) ? "img" : "video";
  return "<div class='slot" + ratio + "' data-kind='" + kind + "' data-file='" + m.file + "'" + poster + once + delay +
         " data-desc=\"" + (m.desc || "") + "\"></div>";
}
function prjLine(p){
  /* leading date column: "25.09" / "25.09 - 25.10" / "25.08-진행중" / "22.02 - 활동중" / "25.01 - 현재" */
  var m = p.match(/^(\d{2,4}\.\d{2}(?:\s*[-~\u2013]\s*(?:\d{2,4}\.\d{2}|\uD604\uC7AC|\uC9C4\uD589\uC911|\uD65C\uB3D9\uC911))?)\s+(.*)$/);
  return esc(m ? m[2] : p);
}
function chapter(c){
  return "<section" + (c.id ? " id='" + c.id + "'" : "") + " class='chapter" + (c.accent ? " accent" : "") + "'><div class='ch-stage'><div class='ch-inner'>" +
    "<p class='kicker'>" + c.kicker + "</p>" +
    "<h2>" + lines(c.title) + "</h2>" +
    "<p class='ch-sub'>" + lines(c.sub) + "</p>" +
  "</div></div></section>";
}

function render(){
  var h = "";

  /* NAV */
  h += "<nav id='siteNav' aria-label='chapters'>" +
    [["Prologue","#prologue"],["Credit","#credit"],["Producing","#producing"],
     ["VP Tools","#vptools"],["Works","#works"],["Contact","#epilogue"]]
    .map(n => "<a href='" + n[1] + "'>" + n[0] + "</a>").join("") +
  "</nav>";

  /* HERO */
  var subArr = Array.isArray(SITE.hero.sub) ? SITE.hero.sub.flat() : [SITE.hero.sub];
  h += "<section id='hero'><div class='hero-stage'>" +
    "<div class='hero-frame' id='heroFrame'>" + slot(SITE.hero.media) +
      "<div class='hero-veil'></div></div>" +
    "<div class='hero-copy'>" +
      "<h1 class='rv'>" + SITE.hero.title.map(t => "<span class='l'>" + esc(t.join("")) + "</span>").join("") + "</h1>" +
      "<p class='sub rv d1'>" + lines(subArr) + "</p>" +
    "</div>" +
    "<div class='scroll-hint'>SCROLL</div>" +
  "</div></section>";

  /* PROLOGUE */
  var pr = SITE.prologue;
  h += "<section id='prologue'><div class='wrap'><div class='grid'>" +
    "<div>" +
      "<p class='kicker rv'>" + pr.kicker + "</p>" +
      "<h2 class='rv d1' style=\"font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,36px);line-height:1.3;margin:24px 0 40px\">" + lines(pr.title) + "</h2>" +
      pr.paragraphs.map((p,i) => "<p class='rv d" + Math.min(i+1,3) + "'>" + lines(p) + "</p>").join("") +
    "</div>" +
    "<div class='rv d2'>" + slot(pr.media) + "</div>" +
  "</div></div></section>";

  /* CAREER */
  h += chapter(SITE.career.chapter);
  h += "<section id='career'><div class='wrap'><div class='t-list'>" +
    SITE.career.items.map(it =>
      "<div class='t-row'>" +
        "<div class='t-when'>" + it.when + "</div>" +
        "<div>" +
          "<div class='t-role'>" + esc(it.role) + "</div>" +
          "<div class='t-org'>" + esc(it.org) + "</div>" +
          "<p class='t-desc'>" + lines(it.desc) + "</p>" +
          (it.projects && it.projects.length ?
            "<div class='t-projects'>" +
              it.projects.map(p => "<div class='t-prj'>" + prjLine(p) + "</div>").join("") +
            "</div>" : "") +
          (it.tags.length ? "<div class='t-tags'>" + it.tags.map(t => "<span>" + t + "</span>").join("") + "</div>" : "") +
        "</div>" +
        (it.logo ?
          "<div class='t-logo slot' data-kind='img' data-file='" + it.logo + "' data-desc='logo'></div>" :
          "<div></div>") +
      "</div>"
    ).join("") +
  "</div></div></section>";

  /* CASES */
  h += chapter(SITE.casesChapter);
  SITE.cases.forEach(function(c){
    var roleArr = Array.isArray(c.role) ? c.role.flat() : [c.role];
    var noArr = Array.isArray(c.no) ? c.no.flat() : [c.no];
    /* pinned title card — each case holds fullscreen like a chapter */
    h += "<section class='chapter case-hold'><div class='ch-stage'><div class='ch-inner'>" +
         "<p class='kicker'>" + lines(noArr) + "</p>" +
         "<h2>" + lines(c.title) + "</h2>" +
         "<p class='ch-sub'>" + lines(roleArr) + "</p>" +
         "</div></div></section>";
    /* case content */
    h += "<section class='case'><div class='wrap'>";
    if(c.main){ h += "<div class='case-media-main rv'>" + slot(c.main) + "</div>"; }
    if(c.card){
      h += "<div class='nda-card rv'>" +
        "<div class='nda-kicker'>" + c.card.kicker + "</div>" +
        "<div class='nda-title'>" + c.card.title + "</div>" +
        "<p class='nda-lines'>" + lines(c.card.lines) + "</p>" +
      "</div>";
    }
    if(c.intro){
      h += "<p class='rv d1 flow' style='color:var(--mute);font-size:15.5px;max-width:none;margin-bottom:56px;line-height:2.1'>" + lines(c.intro) + "</p>";
    }
    if(c.beats){
      h += "<div class='beats'>" + c.beats.map((b,i) =>
        "<div class='beat rv d" + (i+1) + "'>" +
          "<div class='b-label'>" + b.label + "</div>" +
          "<p class='flow'>" + lines(b.lines) + "</p>" +
        "</div>").join("") + "</div>";
    }
    if(c.stats){
      h += "<div class='stat-row rv'>" + c.stats.map(s =>
        "<div class='stat'><b><span class='fill'>" + s.num + "</span></b><span>" + s.label + "</span></div>"
      ).join("") + "</div>";
    }
    if(c.pipeline){
      h += "<div class='pipeline rv'><div class='pipe-track' id='pipeTrack'>" +
        c.pipeline.map(p =>
          "<button class='pipe-stage' data-note-title='" + p.title + "' data-note=\"" + p.note + "\">" +
            "<div class='p-name'>" + p.name + "</div><div class='p-en'>" + p.en + "</div>" +
          "</button>").join("") +
        "</div><div class='pipe-note' id='pipeNote'>" +
          "<span class='pn-title'>PIPELINE</span>단계를 선택하면 해당 공정에서의 내용이 표시됩니다" +
        "</div></div>";
    }
    if(c.gallery){
      if(c.galleryNote){
        h += "<p class='gallery-note rv flow'>" + lines(c.galleryNote) + "</p>";
      }
      h += "<div class='case-gallery rv' data-prefix='" + c.gallery.prefix + "' data-max='" + (c.gallery.max || 12) + "'" +
           (c.gallery.arrows ? " data-arrows='1'" : "") + (c.gallery.hoverPause ? " data-hoverpause='1'" : "") +
           "><div class='cg-track'></div></div>";
    } else if(c.subs){
      h += "<div class='case-subs rv'>" + c.subs.map(s => slot(s)).join("") + "</div>";
    }
    if(c.also){
      h += "<div class='also rv'>" +
        "<div class='also-label'>" + c.also.label + "</div>" +
        "<h4 class='also-title'>" + lines(c.also.title) + "</h4>" +
        (c.also.main ? "<div class='also-main'>" + slot(c.also.main) + "</div>" : "") +
        "<p class='also-lines flow'>" + lines(c.also.lines) + "</p>" +
        (c.also.gallery ?
          "<div class='case-gallery rv' data-prefix='" + c.also.gallery.prefix + "' data-max='" + (c.also.gallery.max || 12) + "'><div class='cg-track'></div></div>" :
          (c.also.media ? "<div class='case-subs'>" + c.also.media.map(s => slot(s)).join("") + "</div>" : "")) +
      "</div>";
    }
    if(c.works){
      h += "<div class='works rv'>" +
        "<div class='also-label'>" + c.works.label + "</div>" +
        "<div class='works-body'>" +
          "<button class='works-edge prev' data-dir='-1' aria-label='previous'>&#8249;</button>" +
          "<button class='works-edge next' data-dir='1' aria-label='next'>&#8250;</button>" +
          "<div class='works-track'>" +
            c.works.items.map(w =>
              "<div class='work-card'>" +
                (w.youtube && driveId(w.youtube) ?
                  "<button class='slot r-wide drive-card' data-drive='" + driveId(w.youtube) + "'>" +
                    "<img src='https://drive.google.com/thumbnail?id=" + driveId(w.youtube) + "&sz=w1200' alt='' loading='lazy'>" +
                    "<span class='play-badge'>&#9654;</span>" +
                  "</button>" :
                 w.youtube ?
                  "<div class='slot r-wide'><iframe src='" + embedSrc(w.youtube) + "' title='" + esc(w.title) + "' loading='lazy' allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture' allowfullscreen></iframe></div>" :
                  "<div class='slot r-wide'><div class='ph'><div class='fname'>youtube id</div><div class='fdesc'>add the video id in SITE data</div></div></div>") +
                "<div class='w-title'>" + esc(w.title) + "</div>" +
                "<div class='w-role'>" + esc(w.role) + "</div>" +
                (w.note ? "<div class='w-note'>" + esc(w.note) + "</div>" : "") +
              "</div>").join("") +
          "</div>" +
        "</div>" +
      "</div>";
    }
    h += "</div></section>";
  });

  /* TOOLS */
  h += chapter(SITE.tools.chapter);
  h += "<section id='tools'><div class='wrap'><div class='tool-list'>" +
    SITE.tools.items.map(t =>
      "<div class='tool-row rv'>" +
        "<div>" +
          "<h4>" + t.name + "</h4>" +
          "<p class='t-what'>" + lines(t.what) + "</p>" +
          "<div class='t-impact'>" + t.impact + "</div>" +
        "</div>" +
        slot(t.media) +
      "</div>").join("") +
  "</div>" +
  "<p class='tm-quote rv'>" + lines(SITE.tools.quote) + "</p>" +
  "</div></section>";

  /* FILMS */
  h += chapter(SITE.films.chapter);
  /* film roll — auto-detects assets/roll_01.jpg ... roll_24.jpg */
  h += "<div class='film-roll' id='filmRoll' aria-hidden='true'>" +
       "<div class='roll-track' id='rollTrack'></div>" +
       "</div>";
  if(SITE.films.manifesto){
    h += "<section class='manifesto'><div class='wrap narrow'>" +
         "<p class='mf rv'>" + lines(SITE.films.manifesto) + "</p>" +
         "</div></section>";
  }
  h += "<section id='films'><div class='wrap'>" +
    (SITE.films.gridLabel ? "<div class='dw-label rv'>" + esc(SITE.films.gridLabel) + "</div>" : "") +
    "<div class='film-grid'>" + SITE.films.items.map((f,i) =>
      "<div class='film-card rv d" + (i+1) + "'>" + slot(f.media) +
        "<div class='f-info'>" +
          "<div class='f-title'>" + f.title + "</div>" +
          "<div class='f-meta'>" + f.meta + "</div>" +
          "<div class='f-award'>" + f.award + "</div>" +
        "</div>" +
      "</div>").join("") + "</div>" +
    (SITE.films.commercials && SITE.films.commercials.length ?
      "<div class='comm rv'><div class='c-head'>Commercial & Client Work</div>" +
        SITE.films.commercials.map(c =>
          "<div class='c-row'>" +
            "<span class='c-client'>" + c.client + "</span>" +
            "<span class='c-role'>" + c.role + "</span>" +
            "<span class='c-year'><span class='fill'>" + c.year + "</span></span>" +
          "</div>").join("") +
      "</div>" : "") +
    (SITE.films.extras ?
      "<div class='comm rv'><div class='c-head'>" + SITE.films.extras.head + "</div>" +
        SITE.films.extras.items.map(x => "<div class='x-row'>" + esc(x) + "</div>").join("") +
      "</div>" : "") +
  "</div></section>";

  /* EPILOGUE */
  var ep = SITE.epilogue;
  h += "<section id='epilogue'><div class='wrap narrow'>" +
    "<p class='kicker rv'>" + ep.kicker + "</p>" +
    "<h2 class='rv d1' style='margin-top:26px'>" + lines(ep.title) + "</h2>" +
    "<p class='ep-sub rv d2'>" + lines(ep.sub) + "</p>" +
    "<a class='cta rv d3' href='" + ep.cta.href + "'>" + ep.cta.label + "</a>" +
  "</div></section>" +
  "<footer><p class='credit'>" + ep.footer + "</p></footer>";

  document.getElementById("app").innerHTML = h;
}
render();

/* ============================================================
   MEDIA SLOT LOADER — missing file shows filename placeholder
   ============================================================ */
(function initSlots(){
  document.querySelectorAll(".slot[data-file]").forEach(function(el){
    var kind = el.getAttribute("data-kind");
    var file = el.getAttribute("data-file");
    var desc = el.getAttribute("data-desc") || "";
    function ph(name){
      el.innerHTML = "<div class='ph'>" +
        "<div class='fname'>" + name + "</div>" +
        (desc ? "<div class='fdesc'>" + desc + "</div>" : "") +
      "</div>";
    }
    if(kind === "img"){
      var img = new Image();
      img.alt = desc;
      img.onload = function(){ el.appendChild(img); };
      img.onerror = function(){ ph(file); };
      img.src = file;
    }else{
      var v = document.createElement("video");
      var delay = parseInt(el.getAttribute("data-delay") || "0", 10);
      v.muted = true; v.setAttribute("muted","");
      if(!delay){ v.autoplay = true; v.setAttribute("autoplay",""); }
      v.loop = !el.getAttribute("data-once");
      v.playsInline = true; v.setAttribute("playsinline","");
      v.preload = el.getAttribute("data-once") ? "auto" : "metadata";
      var poster = el.getAttribute("data-poster");
      if(poster){ v.poster = poster; }
      if(/\.(mp4|webm|mov)$/i.test(file)){
        var s1 = document.createElement("source"); s1.src = file;
      } else {
        var s1 = document.createElement("source"); s1.src = file + ".webm"; s1.type = "video/webm";
        var s2 = document.createElement("source"); s2.src = file + ".mp4";  s2.type = "video/mp4";
      }
      var fails = 0;
      function fail(){ fails++; if(fails >= 2){ ph(file + ".mp4"); } }
      s1.onerror = fail; s2.onerror = fail;
      v.appendChild(s1); if(typeof s2 !== "undefined" && s2){ v.appendChild(s2); }
      el.appendChild(v);
      var armed = delay === 0;
      function tryPlay(){
        if(!armed) return;
        var p = v.play();
        if(p && p.catch){ p.catch(function(){}); }
      }
      v.addEventListener("loadeddata", tryPlay);
      if(delay){
        setTimeout(function(){ armed = true; tryPlay(); }, delay);
      } else {
        tryPlay();
      }
      /* autoplay-policy fallback: start on first user interaction */
      ["pointerdown","touchstart","keydown","scroll"].forEach(function(ev){
        addEventListener(ev, function(){
          if(armed && v.paused && !v.ended){ tryPlay(); }
        }, {once:true, passive:true});
      });
    }
  });
})();

/* ============================================================
   REVEAL
   ============================================================ */
(function(){
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("on"); io.unobserve(e.target); } });
  }, {threshold:.12});
  document.querySelectorAll(".rv").forEach(function(el){ io.observe(el); });
})();

/* ============================================================
   HERO LETTERBOX REVEAL (ScreenX homage)
   full-bleed video letterboxed at 2.39:1; scrolling opens the
   black bars until the frame fills the viewport.
   ============================================================ */
(function(){
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var narrow = matchMedia("(max-width: 900px)").matches;
  if(reduced || narrow) return;
  var hero = document.getElementById("hero");
  var frame = document.getElementById("heroFrame");
  var ticking = false;
  function update(){
    ticking = false;
    var total = hero.offsetHeight - innerHeight;
    var p = Math.min(1, Math.max(0, -hero.getBoundingClientRect().top / total));
    var e = 1 - Math.pow(1 - p, 3);
    var h0 = Math.min(innerWidth / 2.39, innerHeight);
    frame.style.height = (h0 + (innerHeight - h0) * e) + "px";
  }
  addEventListener("scroll", function(){
    if(!ticking){ ticking = true; requestAnimationFrame(update); }
  }, {passive:true});
  addEventListener("resize", update);
  update();
})();

/* ============================================================
   HERO INTRO SEQUENCE — scroll is locked until the light-up
   video ends and the title appears; then scroll unlocks and
   the SCROLL hint fades in.
   Fallbacks: reduced motion, missing video, or 9s safety timer.
   ============================================================ */
(function(){
  var copy = document.querySelector(".hero-copy");
  var slotEl = document.querySelector("#heroFrame .slot");
  var hint = document.querySelector(".scroll-hint");
  if(!copy) return;
  var done = false;
  function reveal(){
    if(done) return; done = true;
    copy.classList.add("lit");
    document.documentElement.classList.remove("locked");
    var nav = document.getElementById("siteNav");
    if(nav){ setTimeout(function(){ nav.classList.add("show"); }, 700); }
    if(hint){ setTimeout(function(){ hint.classList.add("show"); }, 900); }
  }
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ reveal(); return; }
  var v = slotEl ? slotEl.querySelector("video") : null;
  if(!v){ reveal(); return; }
  /* lock the page for the intro */
  if("scrollRestoration" in history){ history.scrollRestoration = "manual"; }
  scrollTo(0, 0);
  document.documentElement.classList.add("locked");
  v.addEventListener("ended", reveal);
  /* placeholder replaced the video (file missing) -> show copy */
  setTimeout(function(){ if(!slotEl.contains(v)) reveal(); }, 1600);
  /* safety net */
  setTimeout(reveal, 9000);
})();

/* ============================================================
   CHAPTER PIN — while a chapter occupies its scroll runway,
   the title stays fullscreen: fade in, hold, fade out.
   Reduced motion: chapters collapse to static blocks.
   ============================================================ */
(function(){
  var chapters = document.querySelectorAll(".chapter");
  if(!chapters.length) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    chapters.forEach(function(ch){
      ch.style.height = "auto";
      var st = ch.querySelector(".ch-stage");
      st.style.position = "relative"; st.style.height = "auto";
      st.style.padding = "110px 28px";
    });
    return;
  }
  var ticking = false;
  function update(){
    ticking = false;
    var vh = innerHeight;
    chapters.forEach(function(ch){
      var r = ch.getBoundingClientRect();
      if(r.bottom < 0 || r.top > vh) return;
      var total = ch.offsetHeight - vh;
      var p = Math.min(1, Math.max(0, -r.top / total));
      var inn = ch.querySelector(".ch-inner");
      var o, up = Math.min(p / .22, 1);
      if(p < .22){ o = p / .22; }
      else if(p > .78){ o = (1 - p) / .22; }
      else { o = 1; }
      inn.style.opacity = o;
      inn.style.transform = "translateY(" + ((1 - up) * 34) + "px)";
    });
  }
  addEventListener("scroll", function(){
    if(!ticking){ ticking = true; requestAnimationFrame(update); }
  }, {passive:true});
  addEventListener("resize", update);
  update();
})();

/* ============================================================
   FILM ROLL — probes assets/roll_01.jpg ... roll_24.jpg,
   builds a doubled track for a seamless left-to-right loop.
   With no files yet, shows placeholder frames.
   ============================================================ */
(function(){
  var track = document.getElementById("rollTrack");
  if(!track) return;
  var MAX = 24;
  var probes = [];
  for(var i = 1; i <= MAX; i++){
    (function(n){
      var name = "assets/roll_" + String(n).padStart(2, "0") + ".jpg";
      probes.push(new Promise(function(res){
        var img = new Image();
        img.onload = function(){ res(name); };
        img.onerror = function(){ res(null); };
        img.src = name;
      }));
    })(i);
  }
  Promise.all(probes).then(function(results){
    var found = results.filter(Boolean);
    var frames = "";
    if(found.length){
      found.forEach(function(f){
        frames += "<div class='roll-frame'><img src='" + f + "' alt=''></div>";
      });
      /* speed scales with content so density feels constant */
      track.style.animationDuration = Math.max(30, found.length * 7) + "s";
    } else {
      for(var k = 1; k <= 4; k++){
        frames += "<div class='roll-ph'>" +
          "<div class='fname'>assets/roll_0" + k + ".jpg</div>" +
          "<div class='fdesc'>on-set photo " + k + "</div>" +
        "</div>";
      }
      track.style.animationDuration = "40s";
    }
    /* double the content: -50% -> 0 loops seamlessly */
    track.innerHTML = frames + frames;
  });
})();

/* ============================================================
   CASE GALLERIES — probe <prefix>1.jpg ... <prefix>N.jpg,
   build a horizontal snap strip with mouse-drag scrolling.
   ============================================================ */
(function(){
  var gals = document.querySelectorAll(".case-gallery");
  gals.forEach(function(g){
    var track = g.querySelector(".cg-track");
    var prefix = g.getAttribute("data-prefix");
    var max = parseInt(g.getAttribute("data-max") || "12", 10);
    var probes = [];
    for(var i = 1; i <= max; i++){
      (function(n){
        probes.push(new Promise(function(res){
          var jpg = prefix + n + ".jpg";
          var img = new Image();
          img.onload = function(){ res({src: jpg, kind: "img"}); };
          img.onerror = function(){
            /* no jpg -> try mp4 */
            var mp4 = prefix + n + ".mp4";
            var v = document.createElement("video");
            v.onloadeddata = function(){ res({src: mp4, kind: "video"}); };
            v.onerror = function(){ res(null); };
            v.preload = "auto";
            v.muted = true;
            v.src = mp4;
          };
          img.src = jpg;
        }));
      })(i);
    }
    Promise.all(probes).then(function(results){
      var found = results.filter(Boolean);
      if(!found.length){
        track.innerHTML =
          "<div class='cg-ph'><div class='fname'>" + prefix + "1.jpg</div><div class='fdesc'>on-set photo, add as many as you like: 1, 2, 3 ...</div></div>";
        return;
      }
      track.innerHTML = found.map(function(f){
        if(f.kind === "video"){
          return "<div class='cg-frame'><video src='" + f.src + "' muted autoplay loop playsinline></video></div>";
        }
        return "<div class='cg-frame'><img src='" + f.src + "' alt=''></div>";
      }).join("");
      if(found.length < 2){ return; }

      var dots = document.createElement("div");
      dots.className = "cg-dots";
      found.forEach(function(_, i){
        var d = document.createElement("button");
        d.className = "cg-dot" + (i === 0 ? " on" : "");
        d.setAttribute("aria-label", "slide " + (i + 1));
        d.addEventListener("click", function(){ goTo(i); restart(); });
        dots.appendChild(d);
      });
      g.appendChild(dots);

      var idx = 0, timer = null;
      var HOLD = 3800; /* ms each image stays centered */
      var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function goTo(i){
        idx = (i + found.length) % found.length;
        track.style.transform = "translateX(-" + (idx * 100) + "%)";
        dots.querySelectorAll(".cg-dot").forEach(function(d, k){
          d.classList.toggle("on", k === idx);
        });
      }
      function start(){ if(!reduced && !timer){ timer = setInterval(function(){ goTo(idx + 1); }, HOLD); } }
      function stop(){ if(timer){ clearInterval(timer); timer = null; } }
      function restart(){ stop(); start(); }
      if(g.getAttribute("data-hoverpause") === "1"){
        g.addEventListener("mouseenter", stop);
        g.addEventListener("mouseleave", start);
      }
      if(g.getAttribute("data-arrows") === "1"){
        [["prev", -1, "\u2039"], ["next", 1, "\u203A"]].forEach(function(a){
          var b = document.createElement("button");
          b.className = "cg-edge " + a[0];
          b.setAttribute("aria-label", a[0]);
          b.textContent = a[2];
          b.addEventListener("click", function(){ goTo(idx + a[1]); restart(); });
          g.appendChild(b);
        });
      }
      start();
    });
  });
})();

/* ============================================================
   WORKS CAROUSEL — edge overlays scroll one viewport of cards
   ============================================================ */
(function(){
  document.querySelectorAll(".works").forEach(function(w){
    var track = w.querySelector(".works-track");
    w.querySelectorAll(".works-edge").forEach(function(btn){
      btn.addEventListener("click", function(){
        var dir = parseInt(btn.getAttribute("data-dir"), 10);
        track.scrollBy({ left: dir * track.clientWidth, behavior: "smooth" });
      });
    });
  });
})();

/* ============================================================
   LIGHTBOX
   ============================================================ */
var LB = document.createElement("div");
LB.id = "lightbox";
LB.innerHTML = "<div class='lb-content'></div><div class='lb-hint'>CLICK / ESC TO CLOSE</div>";
document.body.appendChild(LB);
var LBC = LB.querySelector(".lb-content");
function lbOpen(html){
  LBC.innerHTML = html;
  LB.classList.add("open");
}
function lbClose(){
  LB.classList.remove("open");
  LBC.innerHTML = "";
}
LB.addEventListener("click", lbClose);
addEventListener("keydown", function(e){ if(e.key === "Escape") lbClose(); });

/* drive works cards: click opens the player large */
(function(){
  document.querySelectorAll(".drive-card").forEach(function(b){
    b.addEventListener("click", function(){
      lbOpen("<iframe src='https://drive.google.com/file/d/" + b.getAttribute("data-drive") + "/preview' allow='autoplay' allowfullscreen></iframe>");
    });
  });
})();

/* tool media: click to enlarge */
(function(){
  document.querySelectorAll("#tools .slot").forEach(function(sl){
    sl.addEventListener("click", function(){
      var v = sl.querySelector("video");
      var im = sl.querySelector("img");
      if(v){
        var src = v.currentSrc || (v.querySelector("source") && v.querySelector("source").src) || "";
        lbOpen("<video src='" + src + "' autoplay muted loop playsinline controls></video>");
      } else if(im){
        lbOpen("<img src='" + im.src + "' alt=''>");
      }
    });
  });
})();

/* ============================================================
   NAV SMART SCROLL — chapter targets land in the hold zone
   (title fully lit), not at the dark top of the runway.
   ============================================================ */
(function(){
  var nav = document.getElementById("siteNav");
  if(!nav) return;
  nav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(e){
      var id = (a.getAttribute("href") || "").slice(1);
      var el = document.getElementById(id);
      if(!el) return;
      e.preventDefault();
      var top = el.offsetTop;
      if(el.classList.contains("chapter")){
        /* fade-in completes at 22% of the runway; 30% = fully lit + holding */
        top += Math.max(0, (el.offsetHeight - innerHeight) * 0.3);
      }
      scrollTo({ top: top, behavior: "smooth" });
    });
  });
})();

/* ============================================================
   PIPELINE LIGHT
   ============================================================ */
(function(){
  var stages = document.querySelectorAll(".pipe-stage");
  var note = document.getElementById("pipeNote");
  if(!note) return;
  function light(s){
    stages.forEach(function(x){ x.classList.remove("lit"); });
    s.classList.add("lit");
    note.innerHTML = "<span class='pn-title'>" + s.getAttribute("data-note-title") + "</span>" +
                     s.getAttribute("data-note");
  }
  stages.forEach(function(s){
    ["mouseenter","click","focus"].forEach(function(ev){
      s.addEventListener(ev, function(){ light(s); });
    });
  });
})();
